<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 370" width="290" height="370" role="img" aria-label="Design: curated material and finish swatches with palette">
  <defs>
    <pattern id="dsg-tri" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 30 L 15 0 L 30 30" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <pattern id="dsg-wood" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 2 L 8 2 M 0 6 L 8 6" stroke="#94a3b8" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <pattern id="dsg-stone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" opacity="0.4"/>
      <circle cx="7" cy="6" r="1.4" fill="#94a3b8" opacity="0.45"/>
      <circle cx="4" cy="9" r="0.8" fill="#475569" opacity="0.3"/>
    </pattern>
    <pattern id="dsg-metal" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 2 0 L 2 6" stroke="#64748b" stroke-width="0.7" opacity="0.4"/>
    </pattern>
    <pattern id="dsg-terra" width="26" height="26" patternUnits="userSpaceOnUse">
      <polygon points="5,6 11,7 8,13" fill="#0f5339" opacity="0.22"/>
      <polygon points="18,15 23,21 16,22" fill="#5eead4" opacity="0.4"/>
    </pattern>
    <linearGradient id="dsg-veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f5" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f4f7f5" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="290" height="370" fill="#f4f7f5"/>
  <rect width="290" height="370" fill="url(#dsg-tri)"/>
  <rect width="290" height="370" fill="url(#dsg-veil)"/>

  <g transform="rotate(-7 118 250)">
    <rect x="36" y="196" width="164" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="36" y="196" width="164" height="112" rx="8" fill="url(#dsg-metal)"/>
  </g>

  <g transform="rotate(-3 130 218)">
    <rect x="48" y="164" width="164" height="112" rx="8" fill="#e2ede7" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="48" y="164" width="164" height="112" rx="8" fill="url(#dsg-stone)"/>
  </g>

  <g transform="rotate(2 142 186)">
    <rect x="60" y="132" width="164" height="112" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="60" y="132" width="164" height="112" rx="8" fill="url(#dsg-wood)"/>
  </g>

  <g transform="rotate(6 154 154)">
    <rect x="72" y="100" width="164" height="112" rx="8" fill="#ebf3ef" stroke="#0f5339" stroke-width="1.6"/>
    <rect x="72" y="100" width="164" height="112" rx="8" fill="url(#dsg-terra)"/>
    <circle cx="216" cy="118" r="7" fill="#0f5339"/>
  </g>

  <g>
    <rect x="34" y="42" width="34" height="14" rx="3" fill="#0f5339"/>
    <rect x="72" y="42" width="34" height="14" rx="3" fill="#5eead4"/>
    <rect x="110" y="42" width="34" height="14" rx="3" fill="#cbd5e1"/>
    <rect x="148" y="42" width="34" height="14" rx="3" fill="#64748b"/>
    <rect x="186" y="42" width="34" height="14" rx="3" fill="#e2ede7" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="224" y="42" width="34" height="14" rx="3" fill="#475569"/>
  </g>

  <path d="M 34 70 L 258 70" stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.8"/>

  <g stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
    <path d="M 46 332 L 132 332"/>
    <path d="M 46 346 L 96 346"/>
  </g>
  <polygon points="238,326 248,348 228,348" fill="#0f5339" opacity="0.9"/>
</svg>
